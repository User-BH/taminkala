# Builds the Windows package and publishes it on the "release" branch
# (TaminKala-windows.zip + VERSION.txt); the server's update.bat downloads it from there.
# The same thing can be done by hand with: bash windows/publish.sh
name: Windows package

on:
  push:
    paths: [public/**, bime/**, pichak/**, pichak-ocr/**, windows/**, .github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  publish:
    # only the default branch publishes
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache/windows
          key: windows-${{ hashFiles('windows/build.sh') }}
      - name: Build and publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          bash windows/publish.sh
