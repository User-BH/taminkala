<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="author" content="شرکت رهوار پیوند داده">
  <title>صفحه پیدا نشد | تأمین کالا باختر</title>
  <meta name="theme-color" content="#991522">
  <!-- مسیرها مطلق هستند تا در هر آدرسی (مثلاً /a/b/c) درست بارگذاری شوند -->
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
  <script>
    try { if (localStorage.getItem('tkb-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
  <link href="/assets/css/style.css" rel="stylesheet">
  <style>
    .nf {
      min-height: 100vh; display: grid; place-items: center; text-align: center; color: #fff;
      position: relative; overflow: hidden; padding: 40px 16px;
      background: linear-gradient(115deg, #18191d 0%, #340f15 55%, #8f1020 100%);
    }
    .nf::before {
      content: ''; position: absolute; left: -140px; bottom: -200px; width: 560px; height: 560px;
      border: 1px solid #ffffff14; border-radius: 50%; box-shadow: 0 0 0 80px #ffffff06, 0 0 0 160px #ffffff05;
    }
    .nf::after {
      content: ''; position: absolute; right: -120px; top: -160px; width: 420px; height: 420px; border-radius: 50%;
      background: radial-gradient(circle, rgba(229,57,74,.35), transparent 65%);
    }
    .nf-box { position: relative; z-index: 1; max-width: 560px; }
    .nf-logo { width: 74px; height: 74px; border-radius: 50%; margin: 0 auto 18px; box-shadow: 0 8px 26px rgba(207,23,37,.45); }
    .nf-code {
      font-size: clamp(96px, 22vw, 168px); font-weight: 900; line-height: 1;
      background: linear-gradient(180deg, #ffffff, #ffb3a7 60%, #ff6b78); -webkit-background-clip: text; background-clip: text; color: transparent;
      letter-spacing: 4px;
    }
    .nf h1 { font-size: clamp(20px, 3.4vw, 28px); font-weight: 900; margin: 10px 0 10px; }
    .nf p { color: #ecd4d7; }
    .nf .hero-actions { justify-content: center; }
    .nf small { display: block; margin-top: 34px; color: #cdb2b6; font-size: 12px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-box">
      <a href="/" aria-label="تأمین کالا باختر - صفحه اصلی"><img class="nf-logo" src="/assets/img/logo-192.webp" alt="لوگوی تأمین کالا باختر" width="74" height="74"></a>
      <div class="nf-code">۴۰۴</div>
      <h1>صفحه‌ای که دنبالش هستید پیدا نشد</h1>
      <p>ممکن است آدرس را اشتباه وارد کرده باشید یا این صفحه جابه‌جا شده باشد.</p>
      <div class="hero-actions">
        <a href="/" class="btn btn-primary">بازگشت به صفحه اصلی</a>
        <a href="/#contact" class="btn btn-ghost">تماس با ما</a>
      </div>
      <small>شرکت تأمین کالا باختر · طراحی و توسعه: <a href="https://rahvarpeyvand.ir" target="_blank" rel="noopener" class="rahvar">شرکت رهوار پیوند داده</a></small>
    </div>
  </main>
</body>
</html>
